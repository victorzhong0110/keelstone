name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Unit and fault-injection tests
        run: go test -count=1 -timeout 20m ./...
      - name: Race detector
        run: go test -race -count=1 -timeout 25m ./...
